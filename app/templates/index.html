<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Voicebox TTS</title>
    <style>
        body { font-family: sans-serif; margin: 2em; max-width: 600px; }
        textarea { width: 100%; height: 80px; }
        button, select { padding: 0.5em 1em; font-size: 1em; margin: 0.3em 0; }
        #status { margin-top: 1em; }
        audio { margin-top: 1em; display: block; }
    </style>
</head>
<body>
<h1>Генерация речи</h1>
<form id="tts-form">
    <label>Язык: <select id="lang-select" name="lang">
        <option value="ru">Русский</option>
        <option value="en">English</option>
    </select></label>
    <label>Голос: <select id="voice-select" name="voice_id"></select></label>
    <button id="preview-btn">▶ Прослушать</button><br>
    <textarea name="text" required placeholder="Введите текст..."></textarea><br>
    <button type="submit">Сгенерировать</button>
</form>
<div id="status"></div>
<audio id="player" controls style="display:none"></audio>
<script src="/static/app.js"></script>
</body>
</html>
